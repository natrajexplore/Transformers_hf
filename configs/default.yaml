# LogSense default configuration — single source of truth for labels, models, and paths.

seed: 42

labels:
  - auth_failure
  - config_change
  - link_event
  - threat
  - vpn
  - wireless
  - noise

entity_types:
  - IP
  - USER
  - INTERFACE
  - MAC
  - RULE
  - VLAN

data:
  num_samples: 3000
  vendors: [cisco_ios, cisco_ise, cisco_wlc, panos]
  split:
    train: 0.8
    val: 0.1
    test: 0.1
  # One template per label is held out entirely -> `test_unseen` split (generalization check).
  heldout_templates:
    - pan_auth_fail          # auth_failure
    - ise_config             # config_change
    - pan_link_change        # link_event
    - ios_ips_signature      # threat
    - ios_crypto_inv_spi     # vpn
    - wlc_apmgr              # wireless
    - cdp_native_vlan        # noise
  # A second template per label -> `validation_unseen`, used to pick the best checkpoint.
  val_heldout_templates:
    - ise_5405               # auth_failure
    - ios_parser_cmd         # config_change
    - ios_admin_down         # link_event
    - wlc_rogue_ap           # threat
    - pan_ike                # vpn
    - wlc_ap_join            # wireless
    - ios_logging_host       # noise
  raw_dir: data/raw
  processed_dir: data/processed

models:
  zero_shot: facebook/bart-large-mnli
  classifier: distilbert-base-uncased        # alt: microsoft/deberta-v3-small
  ner: distilbert-base-uncased
  embeddings: sentence-transformers/all-MiniLM-L6-v2

baseline:
  # Zero-shot NLI reads label names as English, so give each label a descriptive phrase.
  hypothesis_template: "This network log message is about {}."
  zero_shot_labels:
    auth_failure: a failed login or authentication failure
    config_change: a device configuration change
    link_event: a network interface or link going up or down
    threat: a security threat, attack, or malware detection
    vpn: a VPN tunnel or remote access connection
    wireless: Wi-Fi clients or wireless access points
    noise: a routine informational event
  tfidf:
    analyzer: char_wb      # character n-grams inside word boundaries — robust to odd log tokens
    ngram_min: 3
    ngram_max: 5
    max_features: 50000
  logreg_C: 10.0
  logreg_max_iter: 2000

ner:
  # Overrides `training` for token classification. 256 tokens: longest log is ~197, and
  # truncating at 128 would drop entities near the end of PAN-OS / ISE lines.
  max_length: 256
  epochs: 3
  learning_rate: 5.0e-5     # NER heads commonly train a bit faster than sequence classifiers

summarizer:
  model: Qwen/Qwen2.5-0.5B-Instruct   # small instruct LLM (<=1.5B per PHASES.md), CPU-friendly
  # PHASES.md suggests 10-50 logs per burst; capped at 15 so CPU LoRA training stays ~30 min.
  burst_min: 8
  burst_max: 15
  train_bursts: 120
  eval_bursts: 20
  max_new_tokens: 120
  max_length: 3072          # prompt + summary tokens; longer examples are skipped, not cut
  epochs: 1
  learning_rate: 2.0e-4     # LoRA trains few weights, so a larger LR than full fine-tuning
  batch_size: 1             # one long burst per forward pass fits CPU memory...
  gradient_accumulation_steps: 4   # ...but update weights every 4 bursts (effective batch 4)
  warmup_ratio: 0.1
  logging_steps: 5
  gradient_checkpointing: true   # trade compute for memory on long bursts
  lora:
    r: 8                    # rank of the low-rank update matrices
    alpha: 16               # scaling of the update (alpha / r)
    dropout: 0.05
    target_modules: [q_proj, k_proj, v_proj, o_proj]   # attention projections
  incidents:                # what the reference note says per category (noise is filler)
    auth_failure: {phrase: authentication failure, keywords: [auth, login, credential, password], action: Check the source and user for brute force; lock or reset the account if unexpected}
    config_change: {phrase: configuration change, keywords: [config, change, command], action: Verify the change against an approved change request and the admin who made it}
    link_event: {phrase: interface up/down, keywords: [link, interface, port, down, flap], action: Check the affected interfaces for flapping, cabling, and errors}
    threat: {phrase: security threat, keywords: [threat, attack, malware, intrusion, rogue], action: Isolate the affected hosts and escalate to the security team}
    vpn: {phrase: VPN, keywords: [vpn, tunnel, ike, ipsec, globalprotect], action: Check tunnel peers, IKE/IPsec settings, and remote-access gateway health}
    wireless: {phrase: wireless, keywords: [wireless, wi-fi, wifi, ap, client, ssid], action: Check AP health, controller join status, and RF conditions}

search:
  top_k: 5                  # neighbors returned by find_similar
  batch_size: 64            # sentences embedded per forward pass (no gradients -> can be large)

api:
  # Test & performance console (python -m logsense.api). 127.0.0.1 = this machine only.
  host: 127.0.0.1
  port: 8000
  max_lines: 200            # lines per /api/analyze request
  max_burst_lines: 30       # lines per /api/summarize request (LLM prompt length)
  max_eval_lines: 5000      # rows in an uploaded labeled file
  benchmark_max_lines: 500  # lines per benchmark run

training:
  max_length: 128
  epochs: 3
  batch_size: 16
  learning_rate: 2.0e-5
  weight_decay: 0.01
  warmup_ratio: 0.1
  early_stopping_patience: 2
  lr_scheduler: linear
  save_total_limit: 2
  logging_steps: 20

paths:
  models_dir: models
  reports_dir: reports

hub:
  username: natrajexplore
  classifier_repo: logsense-classifier
  ner_repo: logsense-ner
  push: false          # flip to true only when ready
